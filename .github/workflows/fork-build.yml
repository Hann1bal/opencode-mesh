name: fork-build

# AOpenCode fork pipeline: typecheck the sync module and produce the
# linux-arm64-musl binary that the Android app bundles.

on:
  push:
    branches: [upstream-sync]
  workflow_dispatch:

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Typecheck core
        run: bun run typecheck
        working-directory: packages/core
      - name: Typecheck server
        run: bun run typecheck
        working-directory: packages/server

  binary:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build linux-arm64-musl
        run: OPENCODE_TARGET=linux-arm64-musl bun run build
        working-directory: packages/cli
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-arm64-musl
          path: packages/cli/dist/cli-linux-arm64-musl/bin/opencode
      # Workflow artifacts cannot be fetched without a token, but the Android
      # pipeline downloads this binary by plain URL. A rolling prerelease asset
      # is publicly downloadable, so publish the same file there.
      - name: Publish rolling release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: fork-sync-dev
        run: |
          ASSET=packages/cli/dist/cli-linux-arm64-musl/bin/opencode
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AOpenCode fork build (upstream-sync)" \
            --prerelease \
            --notes "Rolling linux-arm64-musl opencode binary with the UpstreamSync module. Rebuilt on every push to upstream-sync; consumed by the Android app via OPENCODE_BINARY_URL." \
            "$ASSET" 2>/dev/null \
          || gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Release URL
        run: echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/fork-sync-dev/opencode"
